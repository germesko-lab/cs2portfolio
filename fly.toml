# Fly.io config — deploy with:
#   flyctl launch --copy-config --no-deploy   (creates the app, pick a name/region)
#   flyctl volumes create cs2data --size 1
#   flyctl deploy
# Secrets (when you have real keys):
#   flyctl secrets set PRICE_SOURCE_MODE=live CSFLOAT_API_KEY=... STEAM_ID=...
app = 'cs2portfolio'
primary_region = 'waw'

[build]

[env]
  # 'auto' = real prices (Skinport keyless; CSFloat/CSGOSKINS when keys set).
  PRICE_SOURCE_MODE = 'auto'

[[mounts]]
  source = 'cs2data'
  destination = '/app/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
