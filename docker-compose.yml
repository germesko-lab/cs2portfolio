services:
  app:
    build: .
    ports:
      - '3000:3000'
    volumes:
      - cs2data:/app/data
    environment:
      # Default 'auto': real prices via Skinport (no key) + keyed sources.
      # Set PRICE_SOURCE_MODE=mock for the offline demo (see .env.example).
      PRICE_SOURCE_MODE: ${PRICE_SOURCE_MODE:-auto}
      CSFLOAT_API_KEY: ${CSFLOAT_API_KEY:-}
      CSGOSKINS_API_KEY: ${CSGOSKINS_API_KEY:-}
      STEAM_ID: ${STEAM_ID:-}
    restart: unless-stopped

volumes:
  cs2data:
